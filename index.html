      // ==========================================

              isFavorite: true,
              lucid: true
            }
          ]
        },

        init() {
          // Carica dati da localStorage se presenti
          try {
            const stored = localStorage.getItem('sogni_app_static_v1');
            if (stored) {
              const parsed = JSON.parse(stored);
              if (parsed.dreams) this.state.dreams = parsed.dreams;
            }
          } catch(e) {}

          this.render();

          // Se siamo in caricamento, avvia progress bar automatica
          if (this.state.currentScreen === 'caricamento') {
            this.startSplashProgress();
          }
        },

        persist() {
          try {
            localStorage.setItem('sogni_app_static_v1', JSON.stringify({
              dreams: this.state.dreams
            }));
          } catch(e) {}
        },

        // Navigazione
        navigate(screen) {
          this.state.isDreamModalOpen = false;
          this.state.isSearchOpen = false;
          this.state.currentScreen = screen;
          this.render();

          if (screen === 'caricamento') {
            this.startSplashProgress();
          }
        },

        startSplashProgress() {
          const bar = document.getElementById('splash-progress-bar');
          const txt = document.getElementById('splash-progress-text');
          if (!bar) return;
          let p = 0;
          const timer = setInterval(() => {
            p += 5;
            if (bar) bar.style.width = p + '%';
            if (txt) txt.textContent = Math.min(100, p) + '%';
            if (p >= 100) {
              clearInterval(timer);
              setTimeout(() => {
                if (App.state.currentScreen === 'caricamento') {
                  App.navigate('home');
                }
              }, 300);
            }
          }, 40);
        },

        // Apertura e gestione Modale Sogno
        openDream(dreamId) {
          this.state.selectedDreamId = dreamId;
          this.state.isDreamModalOpen = true;
          this.state.isRecording = false;
          this.state.isPlayingAudio = false;
          clearInterval(this.state.recordingInterval);
          clearInterval(this.state.playingInterval);
          this.renderModal();
        },

        closeDreamModal(e) {
          if (e && e.target && e.target.id !== 'dream-modal-container' && e.target.closest('#dream-modal-box')) {
            return;
          }
          this.state.isDreamModalOpen = false;
          clearInterval(this.state.recordingInterval);
          clearInterval(this.state.playingInterval);
          const modal = document.getElementById('dream-modal-container');
          if (modal) modal.classList.add('hidden');
          // Mostra di nuovo bottom nav
          document.getElementById('bottom-nav-container').classList.remove('hidden');
        },

        // Toggle Categoria nella modale
        toggleCategory(catId) {
          const dream = this.getCurrentDream();
          if (!dream) return;
          if (!dream.categoryIds) dream.categoryIds = [];
          if (dream.categoryIds.includes(catId)) {
            dream.categoryIds = dream.categoryIds.filter(id => id !== catId);
          } else {
            dream.categoryIds.push(catId);
          }
          this.persist();
          this.renderModal();
        },

        // Toggle Preferiti
        toggleFavorite(dreamId) {
          const dream = this.state.dreams.find(d => d.id === dreamId);
          if (dream) {
            dream.isFavorite = !dream.isFavorite;
            this.persist();
            this.renderModal();
            this.render();
          }

        // Registrazione Audio Vocale
        toggleRecording() {
          if (!this.state.isRecording) {
            this.state.isRecording = true;
            this.state.recordingSeconds = 0;
            this.state.recordingInterval = setInterval(() => {
              App.state.recordingSeconds++;
              const el = document.getElementById('audio-timer-text');
              const bar = document.getElementById('audio-progress-bar');
              if (el) el.textContent = '00:' + String(App.state.recordingSeconds).padStart(2, '0');
              if (bar) bar.style.width = Math.min(100, (App.state.recordingSeconds / 30) * 100) + '%';
            }, 1000);
          } else {
            this.state.isRecording = false;
            clearInterval(this.state.recordingInterval);
          }
          this.renderModal();
        },

        // Riproduzione Audio
        toggleAudioPlay() {
          if (!this.state.isPlayingAudio) {
            this.state.isPlayingAudio = true;
            this.state.audioProgress = 0;
            this.state.playingInterval = setInterval(() => {
              App.state.audioProgress += 5;
              const bar = document.getElementById('audio-progress-bar');
              if (bar) bar.style.width = App.state.audioProgress + '%';
              if (App.state.audioProgress >= 100) {
                App.state.isPlayingAudio = false;
                clearInterval(App.state.playingInterval);
                App.renderModal();
              }
            }, 150);
          } else {
            this.state.isPlayingAudio = false;
            clearInterval(this.state.playingInterval);
          }
          this.renderModal();
        },

        // Salvataggio Sogno (Posta)
        saveDream() {
          const dream = this.getCurrentDream();
          const titleInput = document.getElementById('dream-title-input');
          const noteInput = document.getElementById('dream-note-input');

          if (titleInput && titleInput.value.trim()) {
            dream.title = titleInput.value.trim();
          }
          if (noteInput && noteInput.value.trim()) {
            dream.description = noteInput.value.trim();
          }

          this.persist();
          this.showToast('Sogno salvato con successo!');
          this.render();
          this.renderModal();
        },

        showToast(msg) {
          const t = document.getElementById('toast');
          const txt = document.getElementById('toast-text');
          if (!t) return;
          if (txt) txt.textContent = msg;
          t.classList.remove('hidden');
          setTimeout(() => t.classList.add('hidden'), 2500);
        },

        getCurrentDream() {
          let dream = this.state.dreams.find(d => d.id === this.state.selectedDreamId);
          if (!dream) {
            dream = {
              id: this.state.selectedDreamId,
              title: 'Volando tra le stelle',

              dayNumber: parseInt(this.state.selectedDate.split('-')[2] || '9', 10),

              categoryIds: ['cat-peperoncini', 'cat-spirale'],

            this.state.dreams.push(dream);

          return dream;

          this.state.selectedDate = dateStr;

          if (dream) {

                </div>
              </div>

              <div class="bg-white/70 border border-[#b8abec]/70 rounded-[22px] p-3.5 shadow-xs space-y-2.5">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-[#6e5ba8]">Preferenze Diario</h2>
                <div class="flex items-center justify-between py-1 border-b border-[#47387e]/10">
                  <span class="text-xs font-medium text-[#47387e]">Sogni Preferiti</span>
                  <span class="text-[10px] font-bold bg-[#f6be4f] text-[#362569] px-2 py-0.5 rounded-full">★ ${favoriteCount}</span>
                </div>
                <div class="flex items-center justify-between py-1 border-b border-[#47387e]/10">
                  <span class="text-xs font-medium text-[#47387e]">Promemoria Risveglio</span>
                  <span class="text-[10px] text-[#47387e] font-semibold bg-[#dcd4fe] px-2 py-0.5 rounded-full">07:30</span>
                </div>
                <div class="flex items-center justify-between py-1 border-b border-[#47387e]/10">
                  <span class="text-xs font-medium text-[#47387e]">Audio Diario Automatico</span>
                  <span class="text-[10px] text-[#47387e] font-semibold bg-[#dcd4fe] px-2 py-0.5 rounded-full">Abilitato</span>
                </div>

                <button type="button" onclick="App.navigate('caricamento')" class="w-full text-center py-2 text-xs font-semibold text-[#47387e] bg-[#dcd4fe]/60 hover:bg-[#dcd4fe] rounded-xl transition-colors active:scale-95 mt-1">
                  ✦ Rivedi Schermata Caricamento
                </button>
              </div>
            </div>
          `;
        },

        // Render Schermata 4: Modale Scheda Sogno
        renderModal() {
          const modal = document.getElementById('dream-modal-container');
          const navContainer = document.getElementById('bottom-nav-container');
          if (!modal) return;

          if (!this.state.isDreamModalOpen) {
            modal.classList.add('hidden');
            navContainer.classList.remove('hidden');
            return;
          }

          // Nascondi barra di navigazione inferiore durante la modale
          modal.classList.remove('hidden');
          navContainer.classList.add('hidden');

          const dream = this.getCurrentDream();
          const categories = dream.categoryIds || ['cat-peperoncini', 'cat-spirale'];

          modal.innerHTML = `
            <div id="dream-modal-box" class="w-full max-w-[346px] bg-[#dcd4fe] rounded-[28px] p-4 shadow-2xl border border-[#cebffe] flex flex-col gap-3 relative my-auto animate-in zoom-in-95 duration-200">
              <!-- Header della Card: Titolo & Chiusura ✕ -->
              <div class="flex items-center justify-between">
                <input id="dream-title-input" type="text" value="${dream.title}" class="text-lg font-medium text-[#47387e] bg-white/70 px-2 py-0.5 rounded-lg border border-[#47387e]/20 outline-none w-full mr-2" placeholder="Titolo del sogno..." />
                
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" onclick="App.toggleFavorite('${dream.id}')" title="Preferito" class="text-lg active:scale-90 transition-transform ${dream.isFavorite ? 'text-[#f6be4f]' : 'text-[#47387e]/40'}">
                    ★
                  </button>
                  <button type="button" onclick="App.closeDreamModal()" aria-label="Chiudi" class="text-[#47387e] hover:text-[#362569] p-1.5 rounded-full hover:bg-white/40 active:scale-90 transition-all">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                      <line x1="18" y1="6" x2="6" y2="18" />
                      <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Illustrazione Cielo Notturno -->
              <div class="w-full bg-[#e8e2fd] border border-[#beb1ea] rounded-[22px] p-1.5 flex items-center justify-center overflow-hidden">
                ${SVGS.nightSky(false)}
              </div>

              <!-- Funzione 1: Registra il tuo sogno (Microfono) -->
              <div class="bg-[#edeae5]/75 rounded-2xl p-2.5 border border-white/60">
                <div class="flex items-center justify-between">
                  <div>
                    <span class="text-sm text-[#47387e] font-normal block">Registra il tuo sogno</span>
                    <span class="text-[10px] text-[#6e5ba8]">
                      ${this.state.isRecording ? 'Registrazione in corso...' : this.state.isPlayingAudio ? 'Riproduzione vocale...' : 'Trascrizione audio e memo vocale'}
                    </span>
                  </div>

                  <div class="flex items-center gap-1.5">
                    ${!this.state.isRecording ? `
                      <button type="button" onclick="App.toggleAudioPlay()" title="Ascolta" class="w-7 h-7 rounded-full bg-[#f6be4f] text-[#47387e] flex items-center justify-center font-bold text-xs shadow-xs active:scale-90">
                        ${this.state.isPlayingAudio ? '❚❚' : '▶'}
                      </button>
                    ` : ''}

                    <button type="button" onclick="App.toggleRecording()" class="w-8 h-8 rounded-full flex items-center justify-center text-white shadow-xs active:scale-90 transition-all ${this.state.isRecording ? 'bg-rose-500 animate-pulse' : 'bg-[#47387e] hover:bg-[#362569]'}">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                      </svg>
                    </button>
                  </div>
                </div>

                ${(this.state.isRecording || this.state.isPlayingAudio) ? `
                  <div class="mt-2 pt-1.5 border-t border-[#47387e]/10 flex items-center gap-2">
                    <div class="flex-1 bg-white/70 h-1.5 rounded-full overflow-hidden">
                      <div id="audio-progress-bar" class="bg-[#47387e] h-full transition-all duration-150" style="width: ${this.state.audioProgress}%"></div>
                    </div>
                    <span id="audio-timer-text" class="text-[9px] text-[#47387e] font-semibold">00:${String(this.state.recordingSeconds).padStart(2, '0')}</span>
                  </div>
                ` : ''}
              </div>

              <!-- Funzione 2: Categorizza il tuo sogno -->
              <div>
                <div class="flex items-center justify-between mb-1.5 px-0.5">
                  <span class="text-sm text-[#47387e] font-normal">Categorizza il tuo sogno</span>
                  <button type="button" onclick="App.toggleCategory('cat-lucciole')" class="text-[#47387e] text-lg font-bold hover:text-[#362569] active:scale-90 leading-none">+</button>
                </div>

                <div class="grid grid-cols-3 gap-2">
                  <!-- Peperoncini -->
                  <button type="button" onclick="App.toggleCategory('cat-peperoncini')" class="aspect-square rounded-2xl flex flex-col items-center justify-center p-1.5 transition-all relative ${categories.includes('cat-peperoncini') ? 'border-2 border-[#47387e] bg-white/60 shadow-xs' : 'border border-[#b8abec] bg-[#ece7ff]/40 hover:bg-white/30'}">
                    ${SVGS.peperoncini}
                    <span class="text-[9px] font-medium text-[#47387e] mt-0.5">Intenso</span>
                    ${categories.includes('cat-peperoncini') ? '<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-[#f6be4f]"></span>' : ''}
                  </button>

                  <!-- Spirale -->
                  <button type="button" onclick="App.toggleCategory('cat-spirale')" class="aspect-square rounded-2xl flex flex-col items-center justify-center p-1.5 transition-all relative ${categories.includes('cat-spirale') ? 'border-2 border-[#47387e] bg-white/60 shadow-xs' : 'border border-[#b8abec] bg-[#ece7ff]/40 hover:bg-white/30'}">
                    ${SVGS.spirale}
                    <span class="text-[9px] font-medium text-[#47387e] mt-0.5">Lucido</span>
                    ${categories.includes('cat-spirale') ? '<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-[#f6be4f]"></span>' : ''}
                  </button>

                  <!-- Lucciole -->
                  <button type="button" onclick="App.toggleCategory('cat-lucciole')" class="aspect-square rounded-2xl flex flex-col items-center justify-center p-1.5 transition-all relative ${categories.includes('cat-lucciole') ? 'border-2 border-[#47387e] bg-white/60 shadow-xs' : 'border border-[#b8abec] bg-[#ece7ff]/40 hover:bg-white/30'}">
                    ${SVGS.lucciole}
                    <span class="text-[9px] font-medium text-[#47387e] mt-0.5">Etereo</span>
                    ${categories.includes('cat-lucciole') ? '<span class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-[#f6be4f]"></span>' : ''}
                  </button>
                </div>
              </div>

              <!-- Funzione 3: Posta (Input e Invio) -->
              <div class="pt-0.5">
                <div class="flex items-center justify-between gap-2 bg-white/40 border border-[#b8abec]/80 rounded-2xl px-3 py-1.5 focus-within:bg-white/70 transition-colors">
                  <input id="dream-note-input" type="text" value="${dream.description || ''}" placeholder="Posta o aggiungi una riflessione..." onkeydown="if(event.key==='Enter') App.saveDream()" class="flex-1 bg-transparent text-[#47387e] text-xs placeholder-[#6e5ba8]/60 outline-none" />
                  <div class="flex items-center gap-1.5">
                    <span class="text-xs text-[#47387e] font-medium select-none">Posta</span>
                    <button type="button" onclick="App.saveDream()" aria-label="Pubblica" class="w-8 h-8 rounded-full bg-[#47387e] hover:bg-[#362569] text-white flex items-center justify-center shadow-xs active:scale-90 transition-transform">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5">
                        <line x1="12" y1="19" x2="12" y2="5" />
                        <polyline points="5 12 12 5 19 12" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        },

        // Render Modale Ricerca
        renderSearchModal(query = '') {
          const modal = document.getElementById('search-modal-container');
          if (!modal) return;

          const q = (query || '').toLowerCase().trim();
          const filtered = this.state.dreams.filter(d => 
            d.title.toLowerCase().includes(q) || 
            (d.description && d.description.toLowerCase().includes(q))
          );

          modal.innerHTML = `
            <div id="search-modal-box" class="w-full max-w-[346px] bg-[#edebe5] rounded-[28px] p-4.5 shadow-2xl border border-white/60 flex flex-col max-h-[80vh]">
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-medium text-[#47387e]">Cerca nei tuoi sogni</h2>
                <button type="button" onclick="App.closeSearch()" class="w-7 h-7 rounded-full bg-[#dcd4fe] text-[#47387e] flex items-center justify-center text-xs hover:bg-[#cfc3fd]">✕</button>
              </div>

              <div class="relative mb-3">
                <input id="search-text-input" type="text" value="${query}" oninput="App.renderSearchModal(this.value)" placeholder="Cerca titolo o parola..." autofocus class="w-full bg-white/80 border border-[#b8abec] rounded-2xl py-2 pl-8 pr-3 text-xs text-[#47387e] placeholder-[#6e5ba8]/60 outline-none focus:ring-2 focus:ring-[#f6be4f]" />
                <span class="absolute left-2.5 top-2.5 text-xs text-[#6e5ba8]">🔍</span>
              </div>

              <div class="flex-1 overflow-y-auto no-scrollbar space-y-2 pr-0.5">
                ${filtered.length > 0 ? filtered.map(item => `
                  <div onclick="App.closeSearch(); App.openDream('${item.id}');" class="w-full text-left bg-white/70 hover:bg-white p-2.5 rounded-2xl border border-[#b8abec]/60 transition-all flex items-center justify-between cursor-pointer active:scale-[0.99]">
                    <div>
                      <h4 class="text-xs font-semibold text-[#47387e]">${item.title}</h4>
                      <p class="text-[10px] text-[#6e5ba8] line-clamp-1 mt-0.5">${item.description || ''}</p>
                      <span class="text-[9px] bg-[#dcd4fe] text-[#47387e] px-2 py-0.5 rounded-full font-medium inline-block mt-1">${item.dayNumber || 9} Gennaio</span>
                    </div>
                    <span class="text-xs text-[#47387e]">&gt;</span>
                  </div>
                `).join('') : `
                  <div class="text-center py-6 text-xs text-[#6e5ba8]">Nessun sogno trovato</div>
                `}
              </div>
            </div>
          `;

          // Rimette il focus sull'input dopo il render
          const input = document.getElementById('search-text-input');
          if (input && query) {
            input.focus();
            input.setSelectionRange(query.length, query.length);
          }
        }
      };

      // Avvio al caricamento del DOM
      document.addEventListener('DOMContentLoaded', () => {
        App.init();
      });
    </script>
  </body>
</html>
